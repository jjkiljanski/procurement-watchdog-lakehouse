################################################################################
# CI/CD — lint, test, and deploy
#
# Triggers:
#   push to main        → lint + test + deploy to dev (no backfill)
#   push of tag v*      → lint + test + deploy to dev (with backfill)
#                                     + deploy to prod (with backfill)
#
# Environment values (gcp_project, region, backfill_start_date) are inlined
# here because they are static configuration. They must match the corresponding
# tfvars files in procurement-watchdog-gcp-platform.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   DEV_WIF_PROVIDER           ← terraform output wif_provider  (in envs/dev)
#   DEV_CI_SERVICE_ACCOUNT     ← terraform output ci_service_account (in envs/dev)
#   PROD_WIF_PROVIDER          ← terraform output wif_provider  (in envs/prod)
#   PROD_CI_SERVICE_ACCOUNT    ← terraform output ci_service_account (in envs/prod)
################################################################################

name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  # ------------------------------------------------------------------ #
  # Lint and test — always, before any deploy
  # ------------------------------------------------------------------ #
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install ".[dev]" ruff

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest

  # ------------------------------------------------------------------ #
  # Deploy to dev — every push to main or tag
  # ------------------------------------------------------------------ #
  deploy-dev:
    name: Deploy → dev
    needs: lint-test
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: dev
      gcp_project: procwatch-dev
      region: europe-central2
      backfill_start_date: "2024-01-01"   # must match envs/dev/dev.tfvars
      run_backfill: false
    secrets:
      wif_provider: ${{ secrets.DEV_WIF_PROVIDER }}
      ci_service_account: ${{ secrets.DEV_CI_SERVICE_ACCOUNT }}

  # ------------------------------------------------------------------ #
  # Deploy to prod — release tags only, after dev succeeds
  # ------------------------------------------------------------------ #
  deploy-prod:
    name: Deploy → prod
    needs: deploy-dev
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: prod
      gcp_project: procwatch-prod
      region: europe-central2
      backfill_start_date: "2020-01-01"   # must match envs/prod/prod.tfvars
      run_backfill: true
    secrets:
      wif_provider: ${{ secrets.PROD_WIF_PROVIDER }}
      ci_service_account: ${{ secrets.PROD_CI_SERVICE_ACCOUNT }}
