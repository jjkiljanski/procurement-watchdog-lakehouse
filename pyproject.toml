[project]
name = "procurement-watchdog-lakehouse"
version = "0.1.0"
description = "Lakehouse pipeline for Polish public procurement (BZP) data"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "requests>=2.32,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<6",
    "pyspark>=3.5,<4",
    "pyarrow>=15,<20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
